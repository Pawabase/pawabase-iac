name: test
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: The examples validate
        run: |
          for example in examples/*/; do
            (cd "$example" && PAYMENTS_HOOK_SECRET=x SMS_WEBHOOK_SECRET=x ACCOUNTING_WEBHOOK_SECRET=x ERP_HOOK_SECRET=x PAYMENTS_HOOK_SECRET=x pawabase validate)
          done
