[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pawabase-iac"
dynamic = ["version"]
description = "Define a whole Pawabase backend as Python code, validate it, plan it, emulate it and deploy it."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pawabase contributors" }]
keywords = ["pawabase", "iac", "infrastructure-as-code", "cli", "deploy", "backend", "policies", "workflows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Pawabase/pawabase-iac"
Source = "https://github.com/Pawabase/pawabase-iac"
Issues = "https://github.com/Pawabase/pawabase-iac/issues"
Pawabase = "https://github.com/Pawabase/pawabase"

[project.scripts]
pawabase = "pawabase_iac.cli:main"

[tool.hatch.version]
path = "pawabase_iac/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["pawabase_iac"]

[tool.hatch.build.targets.sdist]
include = ["pawabase_iac", "tests", "examples", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.env*", "**/.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
